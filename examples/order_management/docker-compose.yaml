version: "3"

services:
  auth:
    build: ./auth
    container_name: auth
    command: python main.py
    ports:
      - "7101:7101"
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth
      - order
      - user
  order:
    build: ./order
    container_name: order
    command: python main.py
    ports:
      - "7103:7103"
  user:
    build: ./user
    container_name: user
    command: python main.py
    ports:
      - "7102:7102"
